<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFPS Locator Trainer</title>
<style>
  :root{
    --bg:#16181c; --panel:#1e2126; --panel2:#242830; --line:#3a3d44;
    --text:#f4f2ee; --sub:#a9acb3; --dim:#6f727a;
    --good:#3fae76; --bad:#d8564f; --warn:#e0a13c;
  }
  * { box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Noto Sans KR','Segoe UI',-apple-system,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:16px;
  }
  .wrap{ width:100%; max-width:560px; }
  h1{ font-size:17px; letter-spacing:.03em; margin:4px 0 2px; }
  .tagline{ font-size:11px; color:var(--sub); margin-bottom:18px; }

  /* cluster colors */
  .clr1{ --c:#E0954B; } .clr2{ --c:#D57690; } .clr3{ --c:#4CC2A8; }
  .clr4{ --c:#ACC24C; } .clr5{ --c:#E06B64; } .clr6{ --c:#AB88E0; }
  .clr7{ --c:#6BA0E0; } .clr8{ --c:#F08858; } .clr9{ --c:#86A0B2; } .clr10{ --c:#C2A375; }

  /* home screen */
  .cluster-list{ display:flex; flex-direction:column; gap:6px; margin-bottom:18px; }
  .cluster-row{
    display:flex; align-items:center; gap:10px; background:var(--panel);
    border-left:3px solid var(--c); border-radius:6px; padding:9px 12px; cursor:pointer;
    user-select:none;
  }
  .cluster-row.off{ opacity:.35; }
  .cluster-row .dot{ width:8px; height:8px; border-radius:50%; background:var(--c); flex:none; }
  .cluster-row .lbl{ font-size:12.5px; }
  .cluster-row .cnt{ margin-left:auto; font-size:10px; color:var(--dim); }
  .btnrow{ display:flex; gap:8px; margin-top:6px; }
  button{
    font-family:inherit; border:none; border-radius:7px; cursor:pointer;
    font-weight:600; letter-spacing:.01em;
  }
  .btn-main{ background:#e8e6e1; color:#16181c; padding:13px; font-size:14px; width:100%; }
  .btn-ghost{ background:transparent; color:var(--sub); border:1px solid var(--line); padding:8px 12px; font-size:11px; }
  .btn-good{ background:var(--good); color:#0d1a12; padding:12px; font-size:13px; }
  .btn-bad{ background:var(--bad); color:#1a0d0c; padding:12px; font-size:13px; }
  .btn-next{ background:var(--panel2); color:var(--text); border:1px solid var(--line); padding:12px; font-size:13px; }

  /* session header */
  .session-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .phase-tag{ font-size:10px; padding:3px 8px; border-radius:20px; font-weight:700; letter-spacing:.03em; }
  .phase-flash{ background:#3a3d44; color:#c9cbd1; }
  .phase-locator{ background:#4a2f2f; color:#e0a19c; }
  .phase-recheck{ background:#4a3a1f; color:#e0c19c; }
  .progress{ font-size:11px; color:var(--dim); margin-left:auto; }

  .card{
    background:var(--panel); border-left:4px solid var(--c); border-radius:8px;
    padding:22px 18px; min-height:150px; display:flex; flex-direction:column;
    justify-content:center; margin-bottom:14px;
  }
  .clue{ font-size:15px; line-height:1.55; color:#ece9e3; }
  .clue b{ color:var(--c); }
  .answer{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .ans-loc{ font-size:16px; font-weight:800; color:var(--c); margin-bottom:4px; }
  .ans-def{ font-size:12px; color:var(--sub); margin-bottom:8px; }
  .ans-kw{ font-size:11px; color:var(--dim); line-height:1.5; }

  .timerbar{ height:4px; background:var(--panel2); border-radius:2px; overflow:hidden; margin-bottom:14px; }
  .timerbar-fill{ height:100%; background:var(--good); width:100%; transition:width .1s linear, background .3s; }
  .timerbar-fill.over{ background:var(--bad); }

  .grade-row{ display:flex; gap:8px; }
  .grade-row button{ flex:1; }

  .cluster-done{ text-align:center; padding:30px 10px; }
  .cluster-done .big{ font-size:15px; margin-bottom:6px; }
  .cluster-done .stat{ font-size:12px; color:var(--sub); margin-bottom:20px; }

  .summary-sec{ background:var(--panel); border-radius:8px; padding:14px 16px; margin-bottom:10px; }
  .summary-sec h2{ font-size:13px; margin:0 0 8px; }
  .weak-item{
    display:flex; justify-content:space-between; font-size:12px; padding:7px 0;
    border-bottom:1px solid var(--line); color:#e0c19c;
  }
  .weak-item:last-child{ border-bottom:none; }
  .weak-item .loc{ font-weight:700; color:var(--warn); }
  .clear-count{ font-size:12px; color:var(--good); margin-top:4px; }
  .hidden{ display:none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1>CFPS LOCATOR TRAINER</h1>
  <div class="tagline">플래시카드 → 위치찾기 → 재도전 · 클러스터 단위 세션</div>

  <!-- HOME -->
  <div id="home">
    <div class="cluster-list" id="clusterList"></div>
    <div class="btnrow">
      <button class="btn-ghost" id="selAll">전체 선택</button>
      <button class="btn-ghost" id="selNone">전체 해제</button>
      <button class="btn-ghost" id="selWeak">취약 3개만</button>
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:11px;color:var(--sub);margin:12px 0 6px;">
      <input type="checkbox" id="shuffleClusterChk" checked> 클러스터 순서도 랜덤으로
    </label>
    <button class="btn-ghost" id="addCardToggle" style="margin-bottom:10px;">+ 카드 추가</button>
    <div id="addCardPanel" class="hidden" style="margin-bottom:14px;">
      <div style="font-size:10px;color:var(--dim);margin-bottom:6px;line-height:1.5;">한 줄에 카드 하나씩 — 형식: <b>S번호|챕터|정의|키워드1;키워드2;키워드3</b><br>예: 14|C7|화재·가스 감지 및 신호·경보|tour supervisory</div>
      <textarea id="addCardInput" rows="4" style="width:100%;background:#242830;color:#eee;border:1px solid #3a3d44;border-radius:6px;padding:8px;font-size:11px;font-family:monospace;"></textarea>
      <button class="btn-main" id="addCardBtn" style="margin-top:8px;">카드 추가하기</button>
      <div id="addCardMsg" style="font-size:11px;color:var(--good);margin-top:6px;"></div>
    </div>
    <div style="height:6px"></div>
    <button class="btn-main" id="startBtn">세션 시작</button>
  </div>

  <!-- SESSION -->
  <div id="session" class="hidden">
    <div class="session-head">
      <span class="phase-tag" id="phaseTag">FLASHCARD</span>
      <span class="progress" id="progressTxt"></span>
    </div>
    <div class="timerbar"><div class="timerbar-fill" id="timerFill"></div></div>
    <div class="card" id="cardBox">
      <div class="clue" id="clueTxt"></div>
      <div class="answer hidden" id="answerBox">
        <div class="ans-loc" id="ansLoc"></div>
        <div class="ans-def" id="ansDef"></div>
        <div class="ans-kw" id="ansKw"></div>
      </div>
    </div>
    <div id="revealRow">
      <button class="btn-main" id="revealBtn">정답 확인</button>
    </div>
    <div id="gradeRow" class="grade-row hidden">
      <button class="btn-bad" id="wrongBtn">✕ 오답</button>
      <button class="btn-good" id="rightBtn">✓ 정답</button>
    </div>
  </div>

  <!-- CLUSTER DONE -->
  <div id="clusterDone" class="hidden">
    <div class="cluster-done">
      <div class="big" id="cdTitle"></div>
      <div class="stat" id="cdStat"></div>
      <button class="btn-main" id="cdNextBtn">다음 클러스터</button>
    </div>
  </div>

  <!-- FINAL SUMMARY -->
  <div id="finalSummary" class="hidden"></div>

</div>

// keyword가 많은 챕터는 절반을 뜯어 별도 카드로도 만들어서 카드 밀도를 늘림 (같은 챕터의 다른 단서 조합 훈련)
(function expandVariants(){
  const originals = CARDS.slice();
  originals.forEach(card=>{
    if(card.kw.length >= 4){
      const mid = Math.ceil(card.kw.length/2);
      const kwB = card.kw.slice(mid);
      if(kwB.length >= 2){
        CARDS.push({ s:card.s, c:card.c+'b', cl:card.cl, def:card.def, kw:kwB });
      }
    }
  });
})();

// ---------- STATE ----------
let selectedClusters = [];
let sessionQueue = [];      // full ordered queue: [{card, phase}]
let qIndex = 0;
let clusterOrder = [];
let clusterIdx = 0;
let currentClusterCards = [];
let rechecking = [];
let cardState = {};         // key `${s}${c}` -> {correct:0, attempts:0}
let timerStart = 0;
let timerRAF = null;
let currentEntry = null;
let clusterStats = {};      // clusterId -> {cleared, weak:[]}
let allWeak = [];
let allSlow = [];           // cleared but at least one attempt over 5s -> speed drill only
let currentElapsed = 0;

function keyOf(card){ return card.s+'-'+card.c; }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function clusterForSection(s){
  if(s>=1 && s<=3) return 1;
  if(s>=4 && s<=5) return 2;
  if(s>=6 && s<=9) return 3;
  if(s>=10 && s<=11) return 4;
  if(s>=12 && s<=13) return 5;
  if(s===14) return 6;
  if(s>=15 && s<=16) return 7;
  if(s===17) return 8;
  if(s>=18 && s<=20) return 9;
  if(s===21) return 10;
  return 1;
}

function buildClusterList(offIds){
  offIds = offIds || [];
  const el = document.getElementById('clusterList');
  el.innerHTML = '';
  CLUSTERS.forEach(cl=>{
    const count = CARDS.filter(c=>c.cl===cl.id).length;
    const row = document.createElement('div');
    row.className = 'cluster-row clr'+cl.id + (offIds.includes(cl.id) ? ' off' : '');
    row.dataset.id = cl.id;
    row.innerHTML = `<span class="dot"></span><span class="lbl">S그룹 ${cl.id} · ${cl.name}</span><span class="cnt">${count}장</span>`;
    row.onclick = ()=>{
      row.classList.toggle('off');
    };
    el.appendChild(row);
  });
}
buildClusterList();

document.getElementById('addCardToggle').onclick = ()=>{
  document.getElementById('addCardPanel').classList.toggle('hidden');
};

document.getElementById('addCardBtn').onclick = ()=>{
  const raw = document.getElementById('addCardInput').value.trim();
  if(!raw) return;
  const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let added = 0;
  lines.forEach(line=>{
    const parts = line.split('|');
    if(parts.length < 4) return;
    const s = parseInt(parts[0].trim());
    const c = parts[1].trim();
    const def = parts[2].trim();
    const kw = parts[3].split(';').map(k=>k.trim()).filter(Boolean);
    if(!s || !c || kw.length===0) return;
    CARDS.push({ s, c, cl: clusterForSection(s), def: def || `S${s} 관련`, kw });
    added++;
  });
  const offIds = Array.from(document.querySelectorAll('.cluster-row.off')).map(r=>parseInt(r.dataset.id));
  document.getElementById('addCardMsg').textContent = added>0 ? `${added}개 카드 추가됨` : '형식을 확인해줘 (S번호|챕터|정의|키워드1;키워드2)';
  document.getElementById('addCardInput').value = '';
  buildClusterList(offIds);
};

document.getElementById('selAll').onclick = ()=>{
  document.querySelectorAll('.cluster-row').forEach(r=>r.classList.remove('off'));
};
document.getElementById('selNone').onclick = ()=>{
  document.querySelectorAll('.cluster-row').forEach(r=>r.classList.add('off'));
};
document.getElementById('selWeak').onclick = ()=>{
  document.querySelectorAll('.cluster-row').forEach(r=>{
    const id = parseInt(r.dataset.id);
    if(WEAK_DEFAULT.includes(id)) r.classList.remove('off'); else r.classList.add('off');
  });
};

document.getElementById('startBtn').onclick = startSession;

function startSession(){
  selectedClusters = [];
  document.querySelectorAll('.cluster-row').forEach(r=>{
    if(!r.classList.contains('off')) selectedClusters.push(parseInt(r.dataset.id));
  });
  if(selectedClusters.length===0){ alert('클러스터를 하나 이상 선택해줘'); return; }
  cardState = {};
  allWeak = [];
  allSlow = [];
  clusterOrder = document.getElementById('shuffleClusterChk').checked
    ? shuffle(selectedClusters)
    : selectedClusters.slice();
  clusterIdx = 0;
  document.getElementById('home').classList.add('hidden');
  document.getElementById('finalSummary').classList.add('hidden');
  runCluster();
}

function runCluster(){
  if(clusterIdx >= clusterOrder.length){ showFinalSummary(); return; }
  const cl = clusterOrder[clusterIdx];
  currentClusterCards = CARDS.filter(c=>c.cl===cl);
  currentClusterCards.forEach(c=>{ cardState[keyOf(c)] = {correct:0, wrongEver:false, slowEver:false}; });

  // build queue: phase FLASH for all, then phase LOCATOR for all
  sessionQueue = [];
  shuffle(currentClusterCards).forEach(c=> sessionQueue.push({card:c, phase:'FLASHCARD'}));
  shuffle(currentClusterCards).forEach(c=> sessionQueue.push({card:c, phase:'LOCATOR'}));
  rechecking = [];
  qIndex = 0;

  document.getElementById('session').classList.remove('hidden');
  document.getElementById('clusterDone').classList.add('hidden');
  nextCard();
}

function nextCard(){
  if(qIndex < sessionQueue.length){
    currentEntry = sessionQueue[qIndex];
    qIndex++;
    showCard(currentEntry);
    return;
  }
  // base phases done -> gather uncleared for recheck (max 2 recheck passes)
  const uncleared = currentClusterCards.filter(c=> cardState[keyOf(c)].correct < 2);
  if(uncleared.length>0 && (!currentEntry || currentEntry.recheckRound===undefined || currentEntry.recheckRound < 2)){
    const round = (currentEntry && currentEntry.recheckRound!==undefined) ? currentEntry.recheckRound+1 : 1;
    if(round <= 2){
      sessionQueue = shuffle(uncleared).map(c=> ({card:c, phase:'RECHECK', recheckRound:round}));
      qIndex = 0;
      nextCard();
      return;
    }
  }
  finishCluster();
}

function showCard(entry){
  const {card, phase} = entry;
  document.getElementById('answerBox').classList.add('hidden');
  document.getElementById('revealRow').classList.remove('hidden');
  document.getElementById('gradeRow').classList.add('hidden');

  const tag = document.getElementById('phaseTag');
  tag.textContent = phase==='FLASHCARD' ? 'FLASHCARD (워밍업)' : phase==='LOCATOR' ? 'LOCATOR (위치찾기)' : 'RECHECK (재도전)';
  tag.className = 'phase-tag ' + (phase==='FLASHCARD' ? 'phase-flash' : phase==='LOCATOR' ? 'phase-locator' : 'phase-recheck');

  document.getElementById('progressTxt').textContent = `S그룹 ${clusterOrder[clusterIdx]} · ${qIndex}/${sessionQueue.length}`;

  const kwToShow = phase==='FLASHCARD' ? card.kw.slice(0, Math.max(1, Math.ceil(card.kw.length/2))) : card.kw;
  document.getElementById('clueTxt').innerHTML = kwToShow.join(' <b>+</b> ');

  document.getElementById('ansLoc').textContent = `S${card.s} — ${card.c}`;
  document.getElementById('ansDef').textContent = card.def;
  document.getElementById('ansKw').textContent = card.kw.join(' · ');

  document.getElementById('cardBox').className = 'card clr'+card.cl;
  startTimer();
}

function startTimer(){
  const fill = document.getElementById('timerFill');
  fill.classList.remove('over');
  fill.style.width = '100%';
  timerStart = performance.now();
  const DURATION = 5000;
  cancelAnimationFrame(timerRAF);
  function tick(){
    const elapsed = performance.now() - timerStart;
    const pct = Math.max(0, 100 - (elapsed/DURATION)*100);
    fill.style.width = pct+'%';
    if(elapsed > DURATION) fill.classList.add('over');
    if(elapsed < DURATION*2.4) timerRAF = requestAnimationFrame(tick);
  }
  tick();
}

document.getElementById('revealBtn').onclick = ()=>{
  currentElapsed = performance.now() - timerStart;
  cancelAnimationFrame(timerRAF);
  document.getElementById('answerBox').classList.remove('hidden');
  document.getElementById('revealRow').classList.add('hidden');
  document.getElementById('gradeRow').classList.remove('hidden');
};

document.getElementById('rightBtn').onclick = ()=> grade(true);
document.getElementById('wrongBtn').onclick = ()=> grade(false);

function grade(correct){
  const key = keyOf(currentEntry.card);
  if(correct){
    cardState[key].correct++;
    if(currentElapsed > 5000) cardState[key].slowEver = true;
  } else {
    cardState[key].correct = 0;
    cardState[key].wrongEver = true;
  }
  nextCard();
}

function finishCluster(){
  const clId = clusterOrder[clusterIdx];
  const weak = currentClusterCards.filter(c=> cardState[keyOf(c)].correct < 2);
  const cleared = currentClusterCards.filter(c=> cardState[keyOf(c)].correct >= 2);
  const slowCleared = cleared.filter(c=> cardState[keyOf(c)].slowEver);
  const cleanCleared = cleared.filter(c=> !cardState[keyOf(c)].slowEver);
  clusterStats[clId] = { total: currentClusterCards.length, cleared: cleared.length, weak };
  weak.forEach(w=> allWeak.push(w));
  slowCleared.forEach(w=> allSlow.push(w));

  document.getElementById('session').classList.add('hidden');
  document.getElementById('clusterDone').classList.remove('hidden');
  const clName = CLUSTERS.find(c=>c.id===clId).name;
  document.getElementById('cdTitle').textContent = `S그룹 ${clId} 완료 · ${clName}`;
  document.getElementById('cdStat').textContent =
    `빠르게 맞음 ${cleanCleared.length} · 느리게 맞음 ${slowCleared.length} · 모름 ${weak.length}  (전체 ${currentClusterCards.length}장)`;
}

document.getElementById('cdNextBtn').onclick = ()=>{
  clusterIdx++;
  runCluster();
};

function showFinalSummary(){
  document.getElementById('clusterDone').classList.add('hidden');
  const box = document.getElementById('finalSummary');
  box.classList.remove('hidden');

  let totalCards = 0, totalCleared = 0;
  Object.values(clusterStats).forEach(s=>{ totalCards+=s.total; totalCleared+=s.cleared; });
  const cleanCount = totalCleared - allSlow.length;

  let html = `<div class="summary-sec"><h2>세션 요약</h2>
    <div class="clear-count">${totalCleared} / ${totalCards} 장 클리어 (2연속 정답 기준)</div>
    <div style="font-size:11px;color:var(--sub);margin-top:6px;">⚡ 빠르게 맞음 ${cleanCount} · 🐢 느리게 맞음(5초↑) ${allSlow.length} · ❌ 모름 ${allWeak.length}</div>
  </div>`;

  if(allWeak.length>0){
    html += `<div class="summary-sec"><h2>❌ 모르는 위치 — 내용부터 다시 봐야 함</h2>`;
    allWeak.forEach(w=>{
      html += `<div class="weak-item"><span>${w.def}</span><span class="loc">S${w.s} ${w.c}</span></div>`;
    });
    html += `</div>`;
    const bulkText = allWeak.map(w=>`${w.s}|${w.c}|${w.def}|${w.kw.join(';')}`).join('\n');
    html += `<div class="summary-sec"><h2>복사 텍스트 (모르는 항목)</h2>
      <textarea readonly rows="${Math.min(allWeak.length+1,8)}" style="width:100%;background:#242830;color:#eee;border:1px solid #3a3d44;border-radius:6px;padding:8px;font-size:10px;font-family:monospace;" onclick="this.select()">${bulkText}</textarea>
      <div style="font-size:10px;color:var(--dim);margin-top:6px;">클릭 → 전체 선택 → 복사해서 다음 세션 "+ 카드 추가"에 붙여넣으면 중복으로 더 자주 나옴.</div>
    </div>`;
  }

  if(allSlow.length>0){
    html += `<div class="summary-sec"><h2>🐢 아는데 느린 위치 — 속도 훈련만 하면 됨</h2>`;
    allSlow.forEach(w=>{
      html += `<div class="weak-item" style="color:#e0c19c;"><span>${w.def}</span><span class="loc" style="color:#f0b060;">S${w.s} ${w.c}</span></div>`;
    });
    html += `</div>`;
    const bulkTextSlow = allSlow.map(w=>`${w.s}|${w.c}|${w.def}|${w.kw.join(';')}`).join('\n');
    html += `<div class="summary-sec"><h2>복사 텍스트 (느린 항목)</h2>
      <textarea readonly rows="${Math.min(allSlow.length+1,8)}" style="width:100%;background:#242830;color:#eee;border:1px solid #3a3d44;border-radius:6px;padding:8px;font-size:10px;font-family:monospace;" onclick="this.select()">${bulkTextSlow}</textarea>
      <div style="font-size:10px;color:var(--dim);margin-top:6px;">이 항목들은 위치찾기(LOCATOR)만 반복하면 돼 — 플래시카드로 되돌아갈 필요 없음.</div>
    </div>`;
  }

  if(allWeak.length===0 && allSlow.length===0){
    html += `<div class="summary-sec"><h2>👏 선택한 범위 전체 빠르게 클리어</h2></div>`;
  }

  html += `<button class="btn-main" id="restartBtn">처음으로 (다른 클러스터 선택)</button>`;
  box.innerHTML = html;
  document.getElementById('restartBtn').onclick = ()=>{
    box.classList.add('hidden');
    document.getElementById('home').classList.remove('hidden');
  };
}
</script>
