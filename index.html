<body><div class="wrap">
<h1>CFPS LOCATOR TRAINER</h1>
<div class="tagline">키워드 → Section/Chapter 위치찾기 · 오답 재도전 · 카드 자동저장</div>

<div id="home">
<div class="cluster-list" id="clusterList"></div>
<div class="btnrow">
<button class="btn-ghost" id="selAll">전체 선택</button>
<button class="btn-ghost" id="selNone">전체 해제</button>
<button class="btn-ghost" id="selWeak">취약 S4·S14·S17</button>
</div>

<div class="mode-grid">
<div class="mode active" data-mode="locator"><b>LOCATOR</b><br><span class="small">바로 위치 찾기 · 시험 직전 추천</span></div>
<div class="mode" data-mode="flash"><b>FLASH + LOCATOR</b><br><span class="small">워밍업 후 위치 찾기</span></div>
</div>

<label><input type="checkbox" id="shuffleClusterChk" checked style="width:auto"> 클러스터 순서 랜덤</label>

<div class="panel">
<button class="btn-ghost" id="addCardToggle">+ 카드 추가 / 관리</button>
<div id="addCardPanel" class="hidden" style="margin-top:10px">
<div class="small">형식: <b>S번호|챕터|정의|키워드1;키워드2;키워드3</b><br>추가한 카드는 이 브라우저에 자동 저장됩니다.</div>
<textarea id="addCardInput" rows="4" style="margin-top:8px"></textarea>
<div class="btnrow">
<button class="btn-main" id="addCardBtn">카드 추가하기</button>
<button class="btn-ghost" id="clearCustomBtn">추가 카드 전체 삭제</button>
</div>
<div id="addCardMsg" class="small"></div>
</div>
</div>
<button class="btn-main" id="startBtn">세션 시작</button>
</div>

<div id="session" class="hidden">
<div class="session-head"><span class="phase-tag" id="phaseTag"></span><span class="progress" id="progressTxt"></span></div>
<div class="timerbar"><div class="timerbar-fill" id="timerFill"></div></div>
<div class="card clr1" id="cardBox">
<div class="clue" id="clueTxt"></div>
<div class="answer hidden" id="answerBox">
<div class="ans-loc" id="ansLoc"></div>
<div class="ans-def" id="ansDef"></div>
<div class="ans-kw" id="ansKw"></div>
</div></div>
<button class="btn-main" id="revealBtn" style="margin-top:10px">정답 확인</button>
<div id="gradeRow" class="grade-row hidden"><button class="btn-bad" id="wrongBtn">✕ 오답</button><button class="btn-good" id="rightBtn">✓ 정답</button></div>
</div>

<div id="clusterDone" class="hidden panel" style="text-align:center">
<h3 id="cdTitle"></h3><div id="cdStat" class="small" style="margin-bottom:12px"></div>
<button class="btn-main" id="cdNextBtn">다음 클러스터</button>
</div>
<div id="finalSummary" class="hidden"></div>
</div>

const WEAK_DEFAULT = [2,6,8]; // S4, S14, S17이 속한 클러스터
const STORAGE_KEY = 'cfps_custom_cards_v2';
let CUSTOM_CARDS = loadCustomCards();
let CARDS = makeCards();
let mode = 'locator';

function loadCustomCards() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch(e) { return []; }
}
function saveCustomCards() { localStorage.setItem(STORAGE_KEY, JSON.stringify(CUSTOM_CARDS)); }
function makeCards() {
  const out = [...BASE_CARDS, ...CUSTOM_CARDS];
  // 키워드가 많은 챕터는 변형 카드를 만들되 Chapter 표기는 절대 바꾸지 않음.
  const variants = [];
  out.forEach((card, idx) => {
    card.uid = card.uid || `base-${idx}-${card.s}-${card.c}`;
    if(card.kw.length >= 4) {
      const mid = Math.ceil(card.kw.length/2);
      const kwB = card.kw.slice(mid);
      if(kwB.length >= 2) variants.push({...card, uid:card.uid+'-v2', kw:kwB});
    }
  });
  return [...out, ...variants];
}
function clusterForSection(s) {
  if(s<=3)return 1;if(s<=5)return 2;if(s<=9)return 3;if(s<=11)return 4;if(s<=13)return 5;
  if(s===14)return 6;if(s<=16)return 7;if(s===17)return 8;if(s<=20)return 9;if(s===21)return 10;return 1;
}
function keyOf(card) { return card.uid; }
function shuffle(arr) {
  const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a;
}

function buildClusterList(offIds=[]) {
  const el=document.getElementById('clusterList'); el.innerHTML='';
  CLUSTERS.forEach(cl=>{
    const row=document.createElement('div');
    row.className=`cluster-row clr${cl.id}${offIds.includes(cl.id)?' off':''}`;
    row.dataset.id=cl.id;
    row.innerHTML=`<span class="dot"></span><span>S그룹 ${cl.id} · ${cl.name}</span><span class="cnt">${CARDS.filter(c=>c.cl===cl.id).length}장</span>`;
    row.onclick=()=>row.classList.toggle('off'); el.appendChild(row);
  });
}
buildClusterList();

document.querySelectorAll('.mode').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));
  el.classList.add('active'); mode=el.dataset.mode;
});
document.getElementById('selAll').onclick=()=>document.querySelectorAll('.cluster-row').forEach(r=>r.classList.remove('off'));
document.getElementById('selNone').onclick=()=>document.querySelectorAll('.cluster-row').forEach(r=>r.classList.add('off'));
document.getElementById('selWeak').onclick=()=>document.querySelectorAll('.cluster-row').forEach(r=>WEAK_DEFAULT.includes(+r.dataset.id)?r.classList.remove('off'):r.classList.add('off'));
document.getElementById('addCardToggle').onclick=()=>document.getElementById('addCardPanel').classList.toggle('hidden');

document.getElementById('addCardBtn').onclick=()=>{
  const raw=document.getElementById('addCardInput').value.trim(); if(!raw)return;
  let added=0;
  raw.split('\n').map(x=>x.trim()).filter(Boolean).forEach(line=>{
    const p=line.split('|'); if(p.length<4)return;
    const s=parseInt(p[0]); const c=p[1].trim(); const def=p[2].trim();
    const kw=p.slice(3).join('|').split(';').map(x=>x.trim()).filter(Boolean);
    if(!s||s<1||s>21||!c||!kw.length)return;
    CUSTOM_CARDS.push({s,c,cl:clusterForSection(s),def:def||`S${s} 관련`,kw,uid:`custom-${Date.now()}-${Math.random()}`});
    added++;
  });
  saveCustomCards(); CARDS=makeCards();
  const off=Array.from(document.querySelectorAll('.cluster-row.off')).map(r=>+r.dataset.id);
  buildClusterList(off);
  document.getElementById('addCardInput').value='';
  document.getElementById('addCardMsg').textContent=added?`${added}개 저장 완료 · 새로고침해도 유지됨`:'형식을 확인해줘.';
};
document.getElementById('clearCustomBtn').onclick=()=>{
  if(!CUSTOM_CARDS.length) return;
  if(confirm('직접 추가한 카드만 모두 삭제할까요?')) {
    CUSTOM_CARDS=[]; saveCustomCards(); CARDS=makeCards(); buildClusterList();
    document.getElementById('addCardMsg').textContent='추가 카드 삭제 완료';
  }
};

let selectedClusters=[], clusterOrder=[], clusterIdx=0, currentClusterCards=[], sessionQueue=[], qIndex=0;
let currentEntry=null, cardState={}, clusterStats={}, allWeak=[], allSlow=[];
let timerStart=0, timerRAF=null, currentElapsed=0, recheckRound=0;

document.getElementById('startBtn').onclick=startSession;
function startSession(){
  selectedClusters=Array.from(document.querySelectorAll('.cluster-row:not(.off)')).map(r=>+r.dataset.id);
  if(!selectedClusters.length){alert('클러스터를 하나 이상 선택해줘');return}
  // 새 세션 통계 완전 초기화
  cardState={}; clusterStats={}; allWeak=[]; allSlow=[]; recheckRound=0;
  clusterOrder=document.getElementById('shuffleClusterChk').checked?shuffle(selectedClusters):selectedClusters.slice();
  clusterIdx=0;
  document.getElementById('home').classList.add('hidden');
  document.getElementById('finalSummary').classList.add('hidden');
  runCluster();
}
function runCluster(){
  if(clusterIdx>=clusterOrder.length){showFinalSummary();return}
  const cl=clusterOrder[clusterIdx];
  currentClusterCards=CARDS.filter(c=>c.cl===cl);
  currentClusterCards.forEach(c=>cardState[keyOf(c)]={correct:0,wrongEver:false,slowEver:false});
  sessionQueue=[];
  if(mode==='flash') shuffle(currentClusterCards).forEach(c=>sessionQueue.push({card:c,phase:'FLASHCARD'}));
  shuffle(currentClusterCards).forEach(c=>sessionQueue.push({card:c,phase:'LOCATOR'}));
  qIndex=0; recheckRound=0;
  document.getElementById('session').classList.remove('hidden');
  document.getElementById('clusterDone').classList.add('hidden');
  nextCard();
}
function nextCard(){
  if(qIndex<sessionQueue.length){currentEntry=sessionQueue[qIndex++];showCard(currentEntry);return}
  const uncleared=currentClusterCards.filter(c=>cardState[keyOf(c)].correct<1);
  if(uncleared.length&&recheckRound<2){
    recheckRound++;
    sessionQueue=shuffle(uncleared).map(c=>({card:c,phase:'RECHECK'}));qIndex=0;nextCard();return;
  }
  finishCluster();
}
function showCard(entry){
  const {card,phase}=entry;
  document.getElementById('answerBox').classList.add('hidden');
  document.getElementById('revealBtn').classList.remove('hidden');
  document.getElementById('gradeRow').classList.add('hidden');
  const tag=document.getElementById('phaseTag');
  tag.textContent=phase==='FLASHCARD'?'FLASHCARD (워밍업)':phase==='LOCATOR'?'LOCATOR (위치찾기)':`RECHECK ${recheckRound}`;
  document.getElementById('progressTxt').textContent=`S그룹 ${clusterOrder[clusterIdx]} · ${qIndex}/${sessionQueue.length}`;
  const kw=phase==='FLASHCARD'?card.kw.slice(0,Math.max(1,Math.ceil(card.kw.length/2))):card.kw;
  document.getElementById('clueTxt').innerHTML=kw.map(x=>escapeHtml(x)).join(' <b>+</b> ');
  document.getElementById('ansLoc').textContent=`S${card.s} — ${card.c}`;
  document.getElementById('ansDef').textContent=card.def;
  document.getElementById('ansKw').textContent=card.kw.join(' · ');
  document.getElementById('cardBox').className=`card clr${card.cl}`;
  startTimer();
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function startTimer(){
  const fill=document.getElementById('timerFill'); fill.classList.remove('over');fill.style.width='100%';
  timerStart=performance.now(); cancelAnimationFrame(timerRAF);
  const dur=5000;
  function tick(){const e=performance.now()-timerStart;fill.style.width=Math.max(0,100-e/dur*100)+'%';if(e>dur)fill.classList.add('over');if(e<12000)timerRAF=requestAnimationFrame(tick)}
  tick();
}
document.getElementById('revealBtn').onclick=()=>{
  currentElapsed=performance.now()-timerStart;cancelAnimationFrame(timerRAF);
  document.getElementById('answerBox').classList.remove('hidden');
  document.getElementById('revealBtn').classList.add('hidden');
  document.getElementById('gradeRow').classList.remove('hidden');
};
document.getElementById('rightBtn').onclick=()=>grade(true);
document.getElementById('wrongBtn').onclick=()=>grade(false);
function grade(correct){
  const st=cardState[keyOf(currentEntry.card)];
  if(correct){st.correct=1;if(currentElapsed>5000)st.slowEver=true}
  else{st.correct=0;st.wrongEver=true}
  nextCard();
}
function uniqueCards(arr){const m=new Map();arr.forEach(c=>m.set(`${c.s}-${c.c}-${c.def}`,c));return [...m.values()]}
function finishCluster(){
  const clId=clusterOrder[clusterIdx];
  const weak=currentClusterCards.filter(c=>cardState[keyOf(c)].correct<1);
  const cleared=currentClusterCards.filter(c=>cardState[keyOf(c)].correct>=1);
  const slow=cleared.filter(c=>cardState[keyOf(c)].slowEver);
  clusterStats[clId]={total:currentClusterCards.length,cleared:cleared.length,weak};
  allWeak.push(...weak); allSlow.push(...slow);
  document.getElementById('session').classList.add('hidden');
  document.getElementById('clusterDone').classList.remove('hidden');
  document.getElementById('cdTitle').textContent=`S그룹 ${clId} 완료`;
  document.getElementById('cdStat').textContent=`빠르게 맞음 ${cleared.length-slow.length} · 느리게 맞음 ${slow.length} · 모름 ${weak.length}`;
}
document.getElementById('cdNextBtn').onclick=()=>{clusterIdx++;runCluster()};

function showFinalSummary(){
  document.getElementById('session').classList.add('hidden');
  document.getElementById('clusterDone').classList.add('hidden');
  const box=document.getElementById('finalSummary'); box.classList.remove('hidden');
  const stats=Object.values(clusterStats);
  const total=stats.reduce((a,b)=>a+b.total,0), cleared=stats.reduce((a,b)=>a+b.cleared,0);
  const weak=uniqueCards(allWeak), slow=uniqueCards(allSlow).filter(x=>!weak.some(w=>w.s===x.s&&w.c===x.c&&w.def===x.def));
  let h=`<div class="summary"><h3>세션 요약</h3><div class="statgood">${cleared} / ${total} 장 클리어</div><div class="small">⚡ 빠름 ${cleared-slow.length} · 🐢 5초 초과 ${slow.length} · ❌ 오답 ${weak.length}</div></div>`;
  if(weak.length){h+=`<div class="summary"><h3>❌ 다시 볼 위치</h3>${weak.map(w=>`<div class="weak-item"><span>${escapeHtml(w.kw.join(' / '))}</span><span class="loc">S${w.s} ${w.c}</span></div>`).join('')}</div>`}
  if(slow.length){h+=`<div class="summary"><h3>🐢 아는데 느린 위치</h3>${slow.map(w=>`<div class="weak-item"><span>${escapeHtml(w.kw.join(' / '))}</span><span class="loc">S${w.s} ${w.c}</span></div>`).join('')}</div>`}
  h+=`<button class="btn-main" id="restartBtn">처음으로</button>`;
  box.innerHTML=h;
  document.getElementById('restartBtn').onclick=()=>{box.classList.add('hidden');document.getElementById('home').classList.remove('hidden')};
}
</script>
</body></html>
