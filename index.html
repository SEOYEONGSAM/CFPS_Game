<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CFPS Locator Trainer</title>
<style>
  :root{
    --bg:#16181c; --panel:#1e2126; --panel2:#242830; --line:#3a3d44;
    --text:#f4f2ee; --sub:#a9acb3; --dim:#6f727a;
    --good:#3fae76; --bad:#d8564f; --warn:#e0a13c;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Noto Sans KR','Segoe UI',-apple-system,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px
  }
  .wrap{width:100%;max-width:560px}
  h1{font-size:17px;letter-spacing:.03em;margin:4px 0 2px}
  .tagline{font-size:11px;color:var(--sub);margin-bottom:18px}
  .clr1{--c:#E0954B}.clr2{--c:#D57690}.clr3{--c:#4CC2A8}.clr4{--c:#ACC24C}.clr5{--c:#E06B64}
  .clr6{--c:#AB88E0}.clr7{--c:#6BA0E0}.clr8{--c:#F08858}.clr9{--c:#86A0B2}.clr10{--c:#C2A375}
  .cluster-list{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
  .cluster-row{
    display:flex;align-items:center;gap:10px;background:var(--panel);
    border-left:3px solid var(--c);border-radius:6px;padding:9px 12px;cursor:pointer;user-select:none
  }
  .cluster-row.off{opacity:.35}
  .cluster-row .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
  .cluster-row .lbl{font-size:12.5px}
  .cluster-row .cnt{margin-left:auto;font-size:10px;color:var(--dim)}
  .btnrow{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
  button{
    font-family:inherit;border:none;border-radius:7px;cursor:pointer;font-weight:600;letter-spacing:.01em
  }
  .btn-main{background:#e8e6e1;color:#16181c;padding:13px;font-size:14px;width:100%}
  .btn-ghost{background:transparent;color:var(--sub);border:1px solid var(--line);padding:8px 12px;font-size:11px}
  .btn-good{background:var(--good);color:#0d1a12;padding:12px;font-size:13px}
  .btn-bad{background:var(--bad);color:#1a0d0c;padding:12px;font-size:13px}
  .session-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .phase-tag{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:700;letter-spacing:.03em}
  .phase-flash{background:#3a3d44;color:#c9cbd1}.phase-locator{background:#4a2f2f;color:#e0a19c}.phase-recheck{background:#4a3a1f;color:#e0c19c}
  .progress{font-size:11px;color:var(--dim);margin-left:auto}
  .card{
    background:var(--panel);border-left:4px solid var(--c);border-radius:8px;
    padding:22px 18px;min-height:150px;display:flex;flex-direction:column;justify-content:center;margin-bottom:14px
  }
  .clue{font-size:15px;line-height:1.55;color:#ece9e3}
  .clue b{color:var(--c)}
  .answer{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
  .ans-loc{font-size:16px;font-weight:800;color:var(--c);margin-bottom:4px}
  .ans-def{font-size:12px;color:var(--sub);margin-bottom:8px}
  .ans-kw{font-size:11px;color:var(--dim);line-height:1.5}
  .timerbar{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-bottom:14px}
  .timerbar-fill{height:100%;background:var(--good);width:100%;transition:width .1s linear,background .3s}
  .timerbar-fill.over{background:var(--bad)}
  .grade-row{display:flex;gap:8px}.grade-row button{flex:1}
  .cluster-done{text-align:center;padding:30px 10px}
  .cluster-done .big{font-size:15px;margin-bottom:6px}.cluster-done .stat{font-size:12px;color:var(--sub);margin-bottom:20px}
  .summary-sec{background:var(--panel);border-radius:8px;padding:14px 16px;margin-bottom:10px}
  .summary-sec h2{font-size:13px;margin:0 0 8px}
  .weak-item{display:flex;justify-content:space-between;font-size:12px;padding:7px 0;border-bottom:1px solid var(--line);color:#e0c19c;gap:10px}
  .weak-item:last-child{border-bottom:none}.weak-item .loc{font-weight:700;color:var(--warn);white-space:nowrap}
  .hidden{display:none!important}
  textarea{
    width:100%;background:#242830;color:#eee;border:1px solid #3a3d44;border-radius:6px;
    padding:8px;font-size:11px;font-family:monospace
  }
  .note{font-size:10px;color:var(--dim);line-height:1.5}
  .trap-badge{display:inline-block;color:#e0c19c;border:1px solid #725f34;border-radius:20px;padding:2px 7px;font-size:9px;margin-left:6px}
  .history-box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:10px 0 14px}
  .history-title{font-size:12px;font-weight:700;margin-bottom:7px}
  .history-row{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--sub)}
  .history-row b{color:var(--text)}
  .card-history{font-size:10px;color:var(--dim);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>CFPS LOCATOR TRAINER <span class="trap-badge">CONTEXT MODE</span></h1>
  <div class="tagline">문맥 → Section 위치찾기 · Chapter는 참고 · 헷갈리는 단어는 조합으로 훈련</div>

  <div id="home">
    <div class="cluster-list" id="clusterList"></div>
    <div class="btnrow">
      <button class="btn-ghost" id="selAll">전체 선택</button>
      <button class="btn-ghost" id="selNone">전체 해제</button>
      <button class="btn-ghost" id="selWeak">취약 S4·S14·S17</button>
      <button class="btn-ghost" id="selTrap">오늘 함정 위주</button>
    </div>

    <label style="display:flex;align-items:center;gap:8px;font-size:11px;color:var(--sub);margin:12px 0 6px">
      <input type="checkbox" id="shuffleClusterChk" checked> 클러스터 순서도 랜덤으로
    </label>

    <div style="display:flex;align-items:center;gap:10px;margin:8px 0 12px;font-size:11px;color:var(--sub);flex-wrap:wrap">
      <span>생각 시간</span>
      <select id="timerSelect" style="background:#242830;color:#eee;border:1px solid #3a3d44;border-radius:6px;padding:6px 8px">
        <option value="15000" selected>15초 · 추천</option>
        <option value="10000">10초 · 익숙해진 뒤</option>
        <option value="5000">5초 · 반사훈련</option>
        <option value="0">제한 없음</option>
      </select>
      <span style="color:var(--dim)">시간 초과여도 오답 처리 안 됨</span>
    </div>

    <button class="btn-ghost" id="addCardToggle" style="margin-bottom:10px">+ 카드 추가 / 관리</button>
    <div id="addCardPanel" class="hidden" style="margin-bottom:14px">
      <div class="note" style="margin-bottom:6px">
        한 줄에 카드 하나씩 — <b>S번호|챕터|정의|키워드1;키워드2;키워드3</b><br>
        예: 14|C10|연료가스 문맥|fuel gas;natural gas;LP gas
      </div>
      <textarea id="addCardInput" rows="5"></textarea>
      <div class="btnrow">
        <button class="btn-main" id="addCardBtn">카드 추가하기</button>
        <button class="btn-ghost" id="clearAddedBtn">내 추가카드 전체 삭제</button>
      </div>
      <div id="addCardMsg" style="font-size:11px;color:var(--good);margin-top:6px"></div>
      <div class="note" style="margin-top:6px">추가한 카드는 이 브라우저(localStorage)에 자동 저장됩니다.</div>
    </div>

    <div class="history-box">
      <div class="history-title">누적 기록</div>
      <div class="history-row" id="historySummary">
        <span>정답 <b>0</b></span>
        <span>오답 <b>0</b></span>
        <span>정답률 <b>-</b></span>
        <span>학습 카드 <b>0</b></span>
      </div>
      <div class="btnrow" style="margin-top:8px">
        <button class="btn-ghost" id="showWrongOnlyBtn">오답 기록 카드만 선택</button>
        <button class="btn-ghost" id="resetHistoryBtn">기록 초기화</button>
      </div>
    </div>

    <div style="height:6px"></div>
    <button class="btn-main" id="startBtn">세션 시작</button>
  </div>

  <div id="session" class="hidden">
    <div class="session-head">
      <button class="btn-ghost" id="homeBtn" style="padding:5px 8px">← 홈</button>
      <span class="phase-tag" id="phaseTag">FLASHCARD</span>
      <span class="progress" id="progressTxt"></span>
    </div>
    <div class="timerbar"><div class="timerbar-fill" id="timerFill"></div></div>
    <div class="card" id="cardBox">
      <div class="clue" id="clueTxt"></div>
      <div class="answer hidden" id="answerBox">
        <div class="ans-loc" id="ansLoc"></div>
        <div class="ans-def" id="ansDef"></div>
        <div class="ans-kw" id="ansKw"></div>
        <div class="card-history" id="cardHistory"></div>
      </div>
    </div>
    <div id="revealRow"><button class="btn-main" id="revealBtn">정답 확인</button></div>
    <div id="gradeRow" class="grade-row hidden">
      <button class="btn-bad" id="wrongBtn">✕ 오답</button>
      <button class="btn-good" id="rightBtn">✓ 정답</button>
    </div>
  </div>

  <div id="clusterDone" class="hidden">
    <div class="cluster-done">
      <div class="big" id="cdTitle"></div>
      <div class="stat" id="cdStat"></div>
      <div class="btnrow">
        <button class="btn-ghost" id="cdHomeBtn">← 홈으로</button>
        <button class="btn-main" id="cdNextBtn" style="flex:1">다음 클러스터</button>
      </div>
    </div>
  </div>

  <div id="finalSummary" class="hidden"></div>
</div>

function clusterForSection(s){
  if(s>=1&&s<=3)return 1;if(s>=4&&s<=5)return 2;if(s>=6&&s<=9)return 3;if(s>=10&&s<=11)return 4;
  if(s>=12&&s<=13)return 5;if(s===14)return 6;if(s>=15&&s<=16)return 7;if(s===17)return 8;if(s>=18&&s<=20)return 9;if(s===21)return 10;
  return 1;
}
const STORAGE_KEY='cfps_locator_custom_cards_v2';
const HISTORY_KEY='cfps_locator_history_v1';
function loadCustomCards(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    const v=raw?JSON.parse(raw):[];
    return Array.isArray(v)?v:[];
  }catch(e){return []}
}
let CUSTOM_CARDS=loadCustomCards();

function saveCustomCards(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(CUSTOM_CARDS));
}

function loadHistory(){
  try{
    const raw=localStorage.getItem(HISTORY_KEY);
    const v=raw?JSON.parse(raw):{};
    return v && typeof v==='object' ? v : {};
  }catch(e){return {}}
}
let HISTORY=loadHistory();

function saveHistory(){
  localStorage.setItem(HISTORY_KEY,JSON.stringify(HISTORY));
  renderHistorySummary();
}
function historyKey(card){
  return `${card.s}|${card.c}|${card.kw.join('~')}`;
}
function getHistory(card){
  const k=historyKey(card);
  if(!HISTORY[k]) HISTORY[k]={correct:0,wrong:0,last:null,lastAt:null};
  return HISTORY[k];
}
function renderHistorySummary(){
  const vals=Object.values(HISTORY);
  const correct=vals.reduce((a,b)=>a+(b.correct||0),0);
  const wrong=vals.reduce((a,b)=>a+(b.wrong||0),0);
  const total=correct+wrong;
  const studied=vals.filter(v=>(v.correct||0)+(v.wrong||0)>0).length;
  const rate=total?Math.round(correct/total*100)+'%':'-';
  const el=document.getElementById('historySummary');
  if(el){
    el.innerHTML=`<span>정답 <b>${correct}</b></span><span>오답 <b>${wrong}</b></span><span>정답률 <b>${rate}</b></span><span>학습 카드 <b>${studied}</b></span>`;
  }
}

function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a
}
function buildClusterList(offIds=[]){
  const el=document.getElementById('clusterList');el.innerHTML='';
  CLUSTERS.forEach(cl=>{
    const count=CARDS.filter(c=>c.cl===cl.id).length;
    const row=document.createElement('div');
    row.className='cluster-row clr'+cl.id+(offIds.includes(cl.id)?' off':'');
    row.dataset.id=cl.id;
    row.innerHTML=`<span class="dot"></span><span class="lbl">S그룹 ${cl.id} · ${cl.name}</span><span class="cnt">${count}장</span>`;
    row.onclick=()=>row.classList.toggle('off');
    el.appendChild(row)
  })
}

document.getElementById('startBtn').onclick=startSession;
function startSession(){
  TIMER_DURATION=parseInt(document.getElementById('timerSelect').value,10);
  selectedClusters=[];
  document.querySelectorAll('.cluster-row').forEach(r=>{if(!r.classList.contains('off'))selectedClusters.push(parseInt(r.dataset.id))});
  if(!selectedClusters.length){alert('클러스터를 하나 이상 선택해줘');return}
  cardState={};allWeak=[];allSlow=[];clusterStats={};
  clusterOrder=document.getElementById('shuffleClusterChk').checked?shuffle(selectedClusters):selectedClusters.slice();
  clusterIdx=0;
  document.getElementById('home').classList.add('hidden');
  document.getElementById('finalSummary').classList.add('hidden');
  runCluster()
}
function runCluster(){
  if(clusterIdx>=clusterOrder.length){showFinalSummary();return}
  const cl=clusterOrder[clusterIdx];
  currentClusterCards=CARDS.filter(c=>c.cl===cl);
  currentClusterCards.forEach(c=>cardState[keyOf(c)]={correct:0,wrongEver:false,slowEver:false});
  sessionQueue=[];
  shuffle(currentClusterCards).forEach(c=>sessionQueue.push({card:c,phase:'FLASHCARD'}));
  shuffle(currentClusterCards).forEach(c=>sessionQueue.push({card:c,phase:'LOCATOR'}));
  qIndex=0;
  document.getElementById('session').classList.remove('hidden');
  document.getElementById('clusterDone').classList.add('hidden');
  nextCard()
}
function nextCard(){
  if(qIndex<sessionQueue.length){currentEntry=sessionQueue[qIndex++];showCard(currentEntry);return}
  const uncleared=currentClusterCards.filter(c=>cardState[keyOf(c)].correct<2);
  const prior=(currentEntry&&currentEntry.recheckRound)||0;
  if(uncleared.length&&prior<2){
    const round=prior+1;sessionQueue=shuffle(uncleared).map(c=>({card:c,phase:'RECHECK',recheckRound:round}));qIndex=0;nextCard();return
  }
  finishCluster()
}
function showCard(entry){
  const {card,phase}=entry;
  document.getElementById('answerBox').classList.add('hidden');
  document.getElementById('revealRow').classList.remove('hidden');
  document.getElementById('gradeRow').classList.add('hidden');
  const tag=document.getElementById('phaseTag');
  tag.textContent=phase==='FLASHCARD'?'FLASHCARD (워밍업)':phase==='LOCATOR'?'LOCATOR (위치찾기)':'RECHECK (재도전)';
  tag.className='phase-tag '+(phase==='FLASHCARD'?'phase-flash':phase==='LOCATOR'?'phase-locator':'phase-recheck');
  document.getElementById('progressTxt').textContent=`S그룹 ${clusterOrder[clusterIdx]} · ${qIndex}/${sessionQueue.length}`;
  const kwToShow=phase==='FLASHCARD'?card.kw.slice(0,Math.max(1,Math.ceil(card.kw.length/2))):card.kw;
  document.getElementById('clueTxt').innerHTML=kwToShow.map(x=>escapeHtml(x)).join(' <b>+</b> ');
  document.getElementById('ansLoc').textContent=`정답 Section: S${card.s}`;
  document.getElementById('ansDef').textContent=`참고 Chapter: ${card.c} · ${card.def}`;
  document.getElementById('ansKw').textContent=card.kw.join(' · ');
  const h=getHistory(card);
  const attempts=(h.correct||0)+(h.wrong||0);
  const rate=attempts?Math.round((h.correct||0)/attempts*100):null;
  document.getElementById('cardHistory').textContent=
    attempts
      ? `누적 기록 · 정답 ${h.correct||0} / 오답 ${h.wrong||0} / 정답률 ${rate}%${h.last?` · 최근 ${h.last==='correct'?'정답':'오답'}`:''}`
      : '누적 기록 · 아직 풀이 기록 없음';
  document.getElementById('cardBox').className='card clr'+card.cl;
  startTimer()
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function startTimer(){
  const fill=document.getElementById('timerFill');
  fill.classList.remove('over');
  timerStart=performance.now();
  cancelAnimationFrame(timerRAF);

  if(TIMER_DURATION===0){
    fill.style.width='100%';
    fill.style.opacity='.18';
    return;
  }

  fill.style.opacity='1';
  fill.style.width='100%';
  function tick(){
    const elapsed=performance.now()-timerStart;
    const pct=Math.max(0,100-(elapsed/TIMER_DURATION)*100);
    fill.style.width=pct+'%';
    if(elapsed>TIMER_DURATION)fill.classList.add('over');
    if(elapsed<TIMER_DURATION*2.4)timerRAF=requestAnimationFrame(tick);
  }
  tick();
}
document.getElementById('revealBtn').onclick=()=>{
  currentElapsed=performance.now()-timerStart;cancelAnimationFrame(timerRAF);
  document.getElementById('answerBox').classList.remove('hidden');
  document.getElementById('revealRow').classList.add('hidden');
  document.getElementById('gradeRow').classList.remove('hidden')
}
document.getElementById('rightBtn').onclick=()=>grade(true);
document.getElementById('wrongBtn').onclick=()=>grade(false);
function grade(correct){
  const card=currentEntry.card;
  const st=cardState[keyOf(card)];
  if(correct){st.correct++;if(TIMER_DURATION>0 && currentElapsed>TIMER_DURATION)st.slowEver=true}
  else{st.correct=0;st.wrongEver=true}

  const h=getHistory(card);
  if(correct){
    h.correct=(h.correct||0)+1;
    h.last='correct';
  }else{
    h.wrong=(h.wrong||0)+1;
    h.last='wrong';
  }
  h.lastAt=new Date().toISOString();
  saveHistory();

  nextCard()
}
function finishCluster(){
  const clId=clusterOrder[clusterIdx];
  const weak=currentClusterCards.filter(c=>cardState[keyOf(c)].correct<2);
  const cleared=currentClusterCards.filter(c=>cardState[keyOf(c)].correct>=2);
  const slowCleared=cleared.filter(c=>cardState[keyOf(c)].slowEver);
  weak.forEach(w=>allWeak.push(w));slowCleared.forEach(w=>allSlow.push(w));
  clusterStats[clId]={total:currentClusterCards.length,cleared:cleared.length,weak};
  document.getElementById('session').classList.add('hidden');
  document.getElementById('clusterDone').classList.remove('hidden');
  document.getElementById('cdTitle').textContent=`S그룹 ${clId} 완료`;
  document.getElementById('cdStat').textContent=`${cleared.length}/${currentClusterCards.length} 클리어 · 취약 ${weak.length}` + (TIMER_DURATION>0 ? ` · 설정시간 초과 ${slowCleared.length}` : '');
  document.getElementById('cdNextBtn').textContent=clusterIdx===clusterOrder.length-1?'최종 결과':'다음 클러스터'
}
document.getElementById('cdNextBtn').onclick=()=>{clusterIdx++;runCluster()};

  document.getElementById('home').classList.remove('hidden');
}

function showFinalSummary(){
  document.getElementById('clusterDone').classList.add('hidden');
  const fs=document.getElementById('finalSummary');fs.classList.remove('hidden');
  const total=Object.values(clusterStats).reduce((a,b)=>a+b.total,0);
  const cleared=Object.values(clusterStats).reduce((a,b)=>a+b.cleared,0);
  let html=`<div class="summary-sec"><h2>세션 완료</h2><div style="font-size:12px;color:var(--sub)">클리어 ${cleared}/${total} · 취약 ${allWeak.length} · 느린 카드 ${allSlow.length}</div></div>`;
  if(allWeak.length){
    html+=`<div class="summary-sec"><h2>다시 볼 카드</h2>`;
    allWeak.forEach(c=>html+=`<div class="weak-item"><span>${escapeHtml(c.kw.slice(0,3).join(' / '))}</span><span class="loc">S${c.s} ${escapeHtml(c.c)}</span></div>`);
    html+=`</div>`
  }else{
    html+=`<div class="summary-sec"><h2>취약 카드 없음 ✓</h2></div>`
  }
  const vals=Object.values(HISTORY);
  const hc=vals.reduce((a,b)=>a+(b.correct||0),0);
  const hw=vals.reduce((a,b)=>a+(b.wrong||0),0);
  const ht=hc+hw;
  html+=`<div class="summary-sec"><h2>누적 기록</h2><div style="font-size:12px;color:var(--sub)">정답 ${hc} · 오답 ${hw} · 정답률 ${ht?Math.round(hc/ht*100):0}%</div></div>`;
  html+=`<button class="btn-main" onclick="goHome()">처음으로</button>`;
  fs.innerHTML=html
}
</script>
</body>
</html>
